name: Publish Packages

on:
  push:
    branches: [main]
    paths:
      - 'packages/core/**'
      - 'packages/ai/**'
      - 'packages/cli/**'
      - 'packages/opentuicli/**'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - core
          - ai
          - cli
          - opentuicli
          - all
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      core_changed: ${{ steps.check_versions.outputs.core_changed }}
      ai_changed: ${{ steps.check_versions.outputs.ai_changed }}
      cli_changed: ${{ steps.check_versions.outputs.cli_changed }}
      opentui_changed: ${{ steps.check_versions.outputs.opentui_changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      - name: Check version bumps
        id: check_versions
        run: |
          check_pkg() {
            local name=$1 dir=$2 key=$3
            LOCAL=$(node -p "require('./$dir/package.json').version")
            NPM=$(npm view $name version 2>/dev/null || echo "0.0.0")
            echo "$name: local=$LOCAL npm=$NPM"
            if [ "$LOCAL" != "$NPM" ]; then
              echo "${key}_changed=true" >> $GITHUB_OUTPUT
            else
              echo "${key}_changed=false" >> $GITHUB_OUTPUT
            fi
          }
          check_pkg "@cdoing/core" "packages/core" "core"
          check_pkg "@cdoing/ai" "packages/ai" "ai"
          check_pkg "@cdoing/cli" "packages/cli" "cli"
          check_pkg "@cdoing/opentuicli" "packages/opentuicli" "opentui"

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: Build all packages
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/core/dist
            packages/ai/dist
            packages/cli/dist
            packages/opentuicli/dist

  # Step 1: @cdoing/core (no internal deps)
  publish-core:
    needs: build
    runs-on: ubuntu-latest
    if: >
      needs.build.outputs.core_changed == 'true' &&
      (github.event_name == 'push' ||
       github.event.inputs.package == 'core' ||
       github.event.inputs.package == 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: yarn install --ignore-engines
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages
      - name: Publish @cdoing/core
        working-directory: packages/core
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Step 2: @cdoing/ai (depends on core)
  publish-ai:
    needs: [build, publish-core]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.build.outputs.ai_changed == 'true' &&
      (needs.publish-core.result == 'success' || needs.publish-core.result == 'skipped') &&
      (github.event_name == 'push' ||
       github.event.inputs.package == 'ai' ||
       github.event.inputs.package == 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: yarn install --ignore-engines
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages
      - name: Publish @cdoing/ai
        working-directory: packages/ai
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Step 3a: @cdoing/cli (depends on core + ai)
  publish-cli:
    needs: [build, publish-ai]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.build.outputs.cli_changed == 'true' &&
      (needs.publish-ai.result == 'success' || needs.publish-ai.result == 'skipped') &&
      (github.event_name == 'push' ||
       github.event.inputs.package == 'cli' ||
       github.event.inputs.package == 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: yarn install --ignore-engines
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages
      - name: Publish @cdoing/cli
        working-directory: packages/cli
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Step 3b: @cdoing/opentuicli (depends on core + ai, parallel with cli)
  publish-opentui:
    needs: [build, publish-ai]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.build.outputs.opentui_changed == 'true' &&
      (needs.publish-ai.result == 'success' || needs.publish-ai.result == 'skipped') &&
      (github.event_name == 'push' ||
       github.event.inputs.package == 'opentuicli' ||
       github.event.inputs.package == 'all')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: yarn install --ignore-engines
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages
      - name: Publish @cdoing/opentuicli
        working-directory: packages/opentuicli
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
