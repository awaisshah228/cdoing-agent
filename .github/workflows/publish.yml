name: Publish Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to publish'
        required: true
        type: choice
        options:
          - core
          - cli
          - opentuicli
          - both
          - all
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      core_changed: ${{ steps.check_core.outputs.changed }}
      cli_changed: ${{ steps.check_cli.outputs.changed }}
      opentui_changed: ${{ steps.check_opentui.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Check if core version bumped
        id: check_core
        run: |
          LOCAL_VERSION=$(node -p "require('./packages/core/package.json').version")
          NPM_VERSION=$(npm view @cdoing/core version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Core version changed: $NPM_VERSION -> $LOCAL_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Core version unchanged: $LOCAL_VERSION"
          fi

      - name: Check if cli version bumped
        id: check_cli
        run: |
          LOCAL_VERSION=$(node -p "require('./packages/cli/package.json').version")
          NPM_VERSION=$(npm view @cdoing/cli version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "CLI version changed: $NPM_VERSION -> $LOCAL_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "CLI version unchanged: $LOCAL_VERSION"
          fi

      - name: Check if opentuicli version bumped
        id: check_opentui
        run: |
          LOCAL_VERSION=$(node -p "require('./packages/opentuicli/package.json').version")
          NPM_VERSION=$(npm view @cdoing/opentuicli version 2>/dev/null || echo "0.0.0")
          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "OpenTUI CLI version changed: $NPM_VERSION -> $LOCAL_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "OpenTUI CLI version unchanged: $LOCAL_VERSION"
          fi

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: Build all packages
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            packages/core/dist
            packages/ai/dist
            packages/cli/dist
            packages/opentuicli/dist

  publish-core:
    needs: build
    runs-on: ubuntu-latest
    if: >
      needs.build.outputs.core_changed == 'true' &&
      (github.event_name == 'push' ||
       github.event.inputs.package == 'core' ||
       github.event.inputs.package == 'both' ||
       github.event.inputs.package == 'all')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      - name: Publish @cdoing/core
        working-directory: packages/core
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-cli:
    needs: [build, publish-core]
    runs-on: ubuntu-latest
    if: >
      always() &&
      needs.build.result == 'success' &&
      needs.build.outputs.cli_changed == 'true' &&
      (github.event_name == 'push' ||
       github.event.inputs.package == 'cli' ||
       github.event.inputs.package == 'both' ||
       github.event.inputs.package == 'all')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      - name: Publish @cdoing/cli
        working-directory: packages/cli
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-opentui:
    needs: [build, publish-core]
    runs-on: ubuntu-latest
    if: >
      always() &&
      needs.build.result == 'success' &&
      needs.build.outputs.opentui_changed == 'true' &&
      (github.event_name == 'push' ||
       github.event.inputs.package == 'opentuicli' ||
       github.event.inputs.package == 'all')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: packages

      - name: Publish @cdoing/opentuicli
        working-directory: packages/opentuicli
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
