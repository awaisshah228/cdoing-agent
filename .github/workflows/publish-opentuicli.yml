name: Publish opentuicli

on:
  push:
    branches: [main]
    paths:
      - 'packages/opentuicli/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          LOCAL=$(node -p "require('./packages/opentuicli/package.json').version")
          NPM=$(npm view @cdoing/opentuicli version 2>/dev/null || echo "0.0.0")
          echo "version=$LOCAL" >> $GITHUB_OUTPUT
          if [ "$LOCAL" != "$NPM" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          echo "Local: $LOCAL, npm: $NPM"

  publish:
    needs: check-version
    if: needs.check-version.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: Build all platforms
        working-directory: packages/opentuicli
        run: bun run build:all

      - name: Publish
        working-directory: packages/opentuicli
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
