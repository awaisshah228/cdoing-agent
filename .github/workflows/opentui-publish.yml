name: Publish OpenTUI CLI

on:
  push:
    tags:
      - 'tui-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.changed }}
      version: ${{ steps.check_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Check if version bumped
        id: check_version
        run: |
          LOCAL_VERSION=$(node -p "require('./packages/opentuicli/package.json').version")
          NPM_VERSION=$(npm view @cdoing/opentuicli version 2>/dev/null || echo "0.0.0")
          echo "version=$LOCAL_VERSION" >> $GITHUB_OUTPUT
          if [ "$LOCAL_VERSION" != "$NPM_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "OpenTUI CLI version changed: $NPM_VERSION -> $LOCAL_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "OpenTUI CLI version unchanged: $LOCAL_VERSION"
          fi

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: Build all packages
        run: yarn build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: opentui-dist
          path: |
            packages/core/dist
            packages/ai/dist
            packages/opentuicli/dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: >
      needs.build.outputs.version_changed == 'true' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: opentui-dist
          path: packages

      - name: Publish @cdoing/opentuicli
        working-directory: packages/opentuicli
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            npm publish --access public --dry-run
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
