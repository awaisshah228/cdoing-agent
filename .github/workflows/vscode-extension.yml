name: VS Code Extension

on:
  push:
    tags:
      - 'ext-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to marketplace'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build all packages
        run: yarn build

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package extension
        working-directory: packages/vscode-extension
        run: vsce package --no-dependencies -o cdoing-agent.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdoing-agent-vsix
          path: packages/vscode-extension/cdoing-agent.vsix

  publish-marketplace:
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event.inputs.publish == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cdoing-agent-vsix

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Publish to VS Code Marketplace
        run: vsce publish --packagePath cdoing-agent.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-openvsx:
    needs: build
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'push' ||
      github.event.inputs.publish == 'true'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cdoing-agent-vsix

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ovsx
        run: npm install -g ovsx

      - name: Publish to Open VSX
        run: ovsx publish cdoing-agent.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
