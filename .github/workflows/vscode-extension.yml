name: VS Code Extension

on:
  push:
    branches: [main, phase-1]
    paths:
      - 'packages/vscode-extension/**'
      - 'packages/core/**'
      - 'packages/ai/**'
    tags:
      - 'ext-v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to marketplace'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_changed: ${{ steps.check_version.outputs.changed }}
      version: ${{ steps.check_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2

      - name: Check if extension version bumped
        id: check_version
        run: |
          LOCAL_VERSION=$(node -p "require('./packages/vscode-extension/package.json').version")
          echo "version=$LOCAL_VERSION" >> $GITHUB_OUTPUT

          # Check marketplace version using vsce
          npm install -g @vscode/vsce
          MARKETPLACE_VERSION=$(npx vsce show awaisshah228.cdoing-vscode --json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).versions[0].version" 2>/dev/null || echo "0.0.0")

          echo "Local: $LOCAL_VERSION, Marketplace: $MARKETPLACE_VERSION"

          if [ "$LOCAL_VERSION" != "$MARKETPLACE_VERSION" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Extension version changed: $MARKETPLACE_VERSION -> $LOCAL_VERSION"
          else
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "Extension version unchanged: $LOCAL_VERSION (skipping publish)"
          fi

      - name: Install dependencies
        run: yarn install --ignore-engines

      - name: Build all packages
        run: yarn build

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Package extension
        working-directory: packages/vscode-extension
        run: vsce package --no-dependencies -o cdoing-agent.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: cdoing-agent-vsix
          path: packages/vscode-extension/cdoing-agent.vsix

  publish-marketplace:
    needs: build
    runs-on: ubuntu-latest
    if: >
      needs.build.outputs.version_changed == 'true' &&
      (github.event_name == 'push' ||
       github.event.inputs.publish == 'true')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cdoing-agent-vsix

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Publish to VS Code Marketplace
        run: vsce publish --packagePath cdoing-agent.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

  publish-openvsx:
    needs: build
    runs-on: ubuntu-latest
    if: >
      needs.build.outputs.version_changed == 'true' &&
      (github.event_name == 'push' ||
       github.event.inputs.publish == 'true')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cdoing-agent-vsix

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ovsx
        run: npm install -g ovsx

      - name: Publish to Open VSX
        run: ovsx publish cdoing-agent.vsix
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
